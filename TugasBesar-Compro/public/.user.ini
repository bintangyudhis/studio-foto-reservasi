; ─── PHP upload overrides untuk hosting (FPM / CGI / LiteSpeed) ───
; File ini dibaca otomatis oleh PHP-FPM dan sebagian besar shared hosting.
; Salin file ini juga ke root proyek jika hosting menggunakannya.

upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
